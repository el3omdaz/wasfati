<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf6ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>وصفاتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fdf6ee;
  --s1:#fff8f0;
  --s2:#fff;
  --border:#e8ddd0;
  --border2:#d4c4b0;
  --text:#2d1f0e;
  --text2:#7a6554;
  --text3:#b8a898;
  --accent:#c8522a;
  --accent2:#2d8a5e;
  --amber:#e8962a;
  --purple:#6b4fa0;
  --blue:#2a6cb8;
  --r:16px;
  --fn:'IBM Plex Sans Arabic','Arial',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fn);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}

/* BG PATTERN */
#app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 20% 15%, rgba(200,82,42,.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(45,138,94,.06) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(232,150,42,.04) 0%, transparent 70%);
}
#app::after{
  content:'🍋🌿🫙🌶️🧄🍅🫒🌿🍋';
  position:absolute;top:0;left:0;right:0;
  font-size:80px;line-height:1;letter-spacing:20px;
  opacity:.035;pointer-events:none;z-index:0;
  transform:rotate(-8deg) translateY(-10px) translateX(-10px);
  white-space:nowrap;overflow:hidden;
}
.screen,.header,.tab-bar{position:relative;z-index:1}

/* HEADER */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 16px 12px;flex-shrink:0;
  border-bottom:1px solid var(--border);
  background:rgba(253,246,238,.92);
  backdrop-filter:blur(8px);
}
.header-logo{display:flex;align-items:center;gap:8px}
.header-logo .emoji{font-size:28px}
.header-logo .name{font-size:20px;font-weight:700;color:var(--text)}
.header-logo .name span{color:var(--accent)}
.icon-btn{
  background:var(--s2);border:1px solid var(--border);
  border-radius:12px;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;color:var(--text2);
}
.icon-btn:hover{border-color:var(--border2)}

/* TABS */
.tab-bar{
  display:flex;gap:6px;padding:10px 14px 6px;
  overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;background:rgba(253,246,238,.9);
}
.tab-bar::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:20px;
  border:1.5px solid var(--border);
  background:var(--s2);cursor:pointer;
  font-size:12px;font-weight:600;color:var(--text2);
  white-space:nowrap;flex-shrink:0;font-family:var(--fn);
  transition:all .2s;
}
.tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.tab:hover:not(.active){border-color:var(--border2)}

/* SCREENS */
.screen{display:none;flex:1;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* SEARCH BAR */
.search-area{padding:10px 14px 8px;flex-shrink:0}
.search-row{display:flex;gap:8px}
.search-input{
  flex:1;background:var(--s2);border:1.5px solid var(--border);
  border-radius:14px;padding:12px 14px;color:var(--text);
  font-family:var(--fn);font-size:14px;outline:none;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.search-btn{
  background:var(--accent);color:#fff;border:none;
  border-radius:14px;padding:12px 18px;font-size:14px;
  font-weight:700;cursor:pointer;font-family:var(--fn);
  white-space:nowrap;box-shadow:0 3px 10px rgba(200,82,42,.3);
}
.search-btn:disabled{opacity:.5;cursor:not-allowed}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;padding:10px 14px 80px;-webkit-overflow-scrolling:touch}

/* RECIPE PREVIEW CARD */
.recipe-card{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}
.recipe-card-title{
  font-size:15px;font-weight:700;color:var(--text);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
  padding-bottom:10px;border-bottom:1px solid var(--border);
}
.recipe-body{font-size:13px;color:var(--text2);line-height:1.95;white-space:pre-wrap}
.save-btn{
  margin-top:14px;width:100%;padding:13px;border-radius:14px;
  border:none;background:var(--accent2);color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;font-family:var(--fn);
  box-shadow:0 3px 10px rgba(45,138,94,.3);
}

/* LOADING */
.loading-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px;color:var(--text2);font-size:13px}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SAVED CARDS */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcard{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;cursor:pointer;
  position:relative;transition:all .2s;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.wcard:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.wcard-cat{font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;margin-bottom:8px;display:inline-block}
.wcard-emoji{font-size:28px;margin-bottom:6px}
.wcard-title{font-size:12px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:4px}
.wcard-date{font-size:10px;color:var(--text3)}
.wcard-del{position:absolute;top:8px;left:8px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:17px;line-height:1;padding:2px}
.wcard-del:hover{color:#c8522a}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 16px;color:var(--text3);font-size:13px;text-align:center}
.empty-state .big{font-size:48px}

/* BOTTOM NAV */
.bottom-nav{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;background:rgba(253,246,238,.95);
  border-top:1px solid var(--border);
  backdrop-filter:blur(8px);z-index:10;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:10px 4px 8px;cursor:pointer;
  font-size:10px;color:var(--text3);font-family:var(--fn);
  border:none;background:none;
}
.nav-btn .nav-icon{font-size:22px}
.nav-btn.active{color:var(--accent)}
.nav-btn.active .nav-icon{transform:scale(1.1)}

/* MODAL */
.modal-overlay{position:absolute;inset:0;background:rgba(45,31,14,.5);display:flex;align-items:flex-end;z-index:50}
.modal-overlay.hidden{display:none}
.modal-box{
  background:var(--s1);border-radius:24px 24px 0 0;
  border:1px solid var(--border);padding:20px;
  width:100%;max-height:84vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  box-shadow:0 -8px 32px rgba(0,0,0,.12);
}
.modal-drag{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal-body{font-size:13px;color:var(--text2);line-height:1.95;white-space:pre-wrap}
.modal-close{margin-top:16px;width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--border);background:none;color:var(--text2);font-size:14px;cursor:pointer;font-family:var(--fn)}

/* SETTINGS */
.settings-wrap{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.settings-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.settings-card-title{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.settings-row{margin-bottom:12px}
.settings-label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;font-weight:600}
.settings-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);font-family:var(--fn);font-size:13px;outline:none}
.settings-input:focus{border-color:var(--accent)}
.settings-hint{font-size:11px;color:var(--text3);margin-top:5px}
.settings-hint a{color:var(--accent2)}
.api-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:20px;margin-top:8px}
.api-ok{background:rgba(45,138,94,.1);color:var(--accent2);border:1px solid rgba(45,138,94,.2)}
.api-no{background:rgba(200,82,42,.1);color:var(--accent);border:1px solid rgba(200,82,42,.2)}
.primary-btn{width:100%;padding:13px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--fn);margin-top:4px;box-shadow:0 3px 10px rgba(200,82,42,.25)}
.danger-btn{width:100%;padding:11px;border-radius:12px;border:1.5px solid rgba(200,82,42,.3);background:none;color:var(--accent);font-size:13px;cursor:pointer;font-family:var(--fn)}

/* TOAST */
.toast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:20px;padding:10px 20px;font-size:13px;z-index:99;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* CAT COLORS */
.cat-cooking{background:#fff0e8;color:#c8522a}
.cat-sweets{background:#fde8f5;color:#9c3472}
.cat-cleaning{background:#e8f5fd;color:#2a6cb8}
.cat-medical{background:#e8fdf0;color:#2d8a5e}
.cat-other{background:#f0edf8;color:#6b4fa0}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">
      <span class="emoji">🍽️</span>
      <div class="name">وصفا<span>تي</span></div>
    </div>
    <div class="icon-btn" onclick="showScreen('settings')" title="الإعدادات">⚙️</div>
  </div>

  <!-- TABS -->
  <div class="tab-bar" id="tab-bar">
    <div class="tab active" data-cat="all" onclick="setTab('all',this)">🌟 الكل</div>
    <div class="tab" data-cat="cooking" onclick="setTab('cooking',this)">🍳 طبخ</div>
    <div class="tab" data-cat="sweets" onclick="setTab('sweets',this)">🍰 حلويات</div>
    <div class="tab" data-cat="cleaning" onclick="setTab('cleaning',this)">🧹 تنظيف</div>
    <div class="tab" data-cat="medical" onclick="setTab('medical',this)">🌿 وصفات طبية</div>
    <div class="tab" data-cat="other" onclick="setTab('other',this)">✏️ أخرى</div>
  </div>

  <!-- SCREEN: SEARCH -->
  <div class="screen active" id="screen-search">
    <div class="search-area">
      <div class="search-row">
        <input class="search-input" id="query-input" placeholder="مثال: بيتزا إيطالية، مزيل بقع..." />
        <button class="search-btn" id="search-btn" onclick="searchRecipe()">ابحث</button>
      </div>
    </div>
    <div class="scroll" id="search-scroll">
      <div id="result-area">
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 16px">
          <span style="font-size:12px;color:var(--text3);width:100%;margin-bottom:4px">اقتراحات سريعة:</span>
          <button class="tab" style="border-color:var(--border)" onclick="quickSearch('بيتزا إيطالية')">🍕 بيتزا</button>
          <button class="tab" style="border-color:var(--border)" onclick="quickSearch('كيك شوكولاتة')">🎂 كيك</button>
          <button class="tab" style="border-color:var(--border)" onclick="quickSearch('مزيل بقع طبيعي')">🧴 مزيل بقع</button>
          <button class="tab" style="border-color:var(--border)" onclick="quickSearch('شاي أعشاب للمناعة')">🌿 أعشاب</button>
          <button class="tab" style="border-color:var(--border)" onclick="quickSearch('منظف الحمام بالخل')">🧼 منظف</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN: SAVED -->
  <div class="screen" id="screen-saved">
    <div class="scroll"><div id="cards-container"></div></div>
  </div>

  <!-- SCREEN: SETTINGS -->
  <div class="screen" id="screen-settings">
    <div class="settings-wrap">

      <div class="settings-card">
        <div class="settings-card-title">🔑 مفتاح API</div>
        <div class="settings-row">
          <label class="settings-label">نوع الخدمة</label>
          <select class="settings-input" id="api-type" onchange="onApiTypeChange()">
            <option value="openrouter">OpenRouter</option>
            <option value="gemini">Google Gemini</option>
          </select>
        </div>
        <div class="settings-row">
          <label class="settings-label" id="key-label">مفتاح OpenRouter</label>
          <input class="settings-input" type="password" id="api-key-input" placeholder="sk-or-v1-..." />
          <div class="settings-hint" id="key-hint">احصل على مفتاح مجاني من <a href="https://openrouter.ai/settings/keys" target="_blank">openrouter.ai</a></div>
          <div id="api-status-badge"></div>
        </div>
        <button class="primary-btn" onclick="saveSettings()">💾 حفظ المفتاح</button>
      </div>

      <div class="settings-card">
        <div class="settings-card-title">🌐 اللغة</div>
        <div class="settings-row">
          <label class="settings-label">لغة الوصفات</label>
          <select class="settings-input" id="lang-select">
            <option value="ar">العربية</option>
            <option value="en">English</option>
          </select>
        </div>
        <button class="primary-btn" onclick="saveSettings()">💾 حفظ</button>
      </div>

      <div class="settings-card">
        <div class="settings-card-title">🗑️ البيانات</div>
        <button class="danger-btn" onclick="clearAll()">حذف جميع الوصفات المحفوظة</button>
      </div>

    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal-box">
      <div class="modal-drag"></div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-close" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-search" onclick="showScreen('search')">
      <span class="nav-icon">🔍</span>ابحث
    </button>
    <button class="nav-btn" id="nav-saved" onclick="showScreen('saved')">
      <span class="nav-icon">🗂️</span>محفوظاتي
    </button>
    <button class="nav-btn" id="nav-settings" onclick="showScreen('settings')">
      <span class="nav-icon">⚙️</span>إعدادات
    </button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const STORAGE = { recipes:'wasafat_v2', settings:'wasafat_settings_v1' };
const load = (k,d) => { try{return JSON.parse(localStorage.getItem(k))??d;}catch{return d;} };
const persist = (k,v) => localStorage.setItem(k,JSON.stringify(v));

let settings = load(STORAGE.settings, {apiKey:'',apiType:'openrouter',lang:'ar'});
let activeTab = 'all';

const CAT_LABELS = {cooking:'طبخ',sweets:'حلويات',cleaning:'تنظيف',medical:'وصفات طبية',other:'أخرى'};
const CAT_CLASS = {cooking:'cat-cooking',sweets:'cat-sweets',cleaning:'cat-cleaning',medical:'cat-medical',other:'cat-other'};

const EMOJI_MAP = {
  بيتزا:'🍕',دجاج:'🍗',شاي:'🍵',قهوة:'☕',كيك:'🎂',خبز:'🍞',
  سلطة:'🥗',حساء:'🍲',شوكولاتة:'🍫',عجين:'🥐',أرز:'🍚',سمك:'🐟',
  لحم:'🥩',تنظيف:'🧹',مزيل:'🧴',صابون:'🧼',بقع:'🧽',فطيرة:'🥧',
  شوربة:'🍜',مكرونة:'🍝',برغر:'🍔',عصير:'🥤',ليمون:'🍋',تفاح:'🍎',
  زعتر:'🌿',أعشاب:'🌱',عسل:'🍯',زنجبيل:'🫚',خل:'🍶',منظف:'🫧',
};
function getEmoji(t){
  for(const[k,v]of Object.entries(EMOJI_MAP)) if(t.includes(k)) return v;
  return '📋';
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  const nb = document.getElementById('nav-'+name);
  if(nb) nb.classList.add('active');
  if(name==='saved') renderCards();
  if(name==='settings') loadSettingsUI();
}

function setTab(cat, el){
  activeTab = cat;
  document.querySelectorAll('.tab-bar .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function quickSearch(q){
  document.getElementById('query-input').value = q;
  searchRecipe();
}

// ── API CALL ──
async function callAI(prompt){
  if(!settings.apiKey) throw new Error('no_key');
  if(settings.apiType==='gemini'){
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${settings.apiKey}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1200}})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||'HTTP '+res.status);}
    const data=await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text||'';
  } else {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${settings.apiKey}`,'HTTP-Referer':'https://wasafati.app','X-Title':'Wasafati'},
      body:JSON.stringify({model:'google/gemini-2.5-flash-lite',max_tokens:1200,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||'HTTP '+res.status);}
    const data=await res.json();
    return data.choices?.[0]?.message?.content||'';
  }
}

// ── SEARCH ──
let currentRecipe = null;

async function searchRecipe(){
  const q = document.getElementById('query-input').value.trim();
  if(!q) return;
  if(!settings.apiKey){showToast('⚠️ أضف مفتاح API من الإعدادات');showScreen('settings');return;}
  const btn = document.getElementById('search-btn');
  btn.disabled=true;btn.textContent='⏳';
  currentRecipe=null;
  document.getElementById('result-area').innerHTML=`<div class="loading-wrap"><div class="spinner"></div><span>جاري البحث عن أفضل وصفة...</span></div>`;

  // Auto-detect category
  const catHints = {
    cooking:['طبخ','أكل','طعام','دجاج','لحم','أرز','مكرونة','بيتزا','شوربة','سمك','خضار'],
    sweets:['حلو','كيك','بسكويت','شوكولاتة','حلويات','عجينة','تارت','قهوة','كريمة'],
    cleaning:['تنظيف','مزيل','بقع','صابون','منظف','غسيل','خل','ليمون للتنظيف'],
    medical:['أعشاب','علاج','طبي','نبات','مناعة','زنجبيل','نعناع','يانسون','كمون','شاي'],
  };
  let detectedCat = 'other';
  for(const[cat,words]of Object.entries(catHints)){
    if(words.some(w=>q.includes(w))){detectedCat=cat;break;}
  }

  const catPrompt = activeTab!=='all' ? `هذه الوصفة من فئة: ${CAT_LABELS[activeTab]}.` : '';
  const isAr = settings.lang==='ar';
  const prompt = isAr
    ? `أنت خبير متخصص في الوصفات. ${catPrompt} أعطني أفضل وصفة لـ "${q}" بشكل منظم باللغة العربية.\nاتبع هذا التنسيق:\n\n🏷️ الاسم: [اسم الوصفة]\n⏱️ وقت التحضير: [الوقت]\n👥 الكمية: [العدد أو الحجم]\n\n📝 المكونات:\n- [مكون مع الكمية]\n\n👨‍🍳 طريقة التحضير:\n1. [خطوة تفصيلية]\n\n💡 نصيحة: [نصيحة مهمة]`
    : `You are a recipe expert. ${catPrompt} Give me the best recipe for "${q}".\n\nFormat:\n🏷️ Name: [...]\n⏱️ Time: [...]\n👥 Yield: [...]\n\n📝 Ingredients:\n- [...]\n\n👨‍🍳 Instructions:\n1. [...]\n\n💡 Tip: [...]`;

  try{
    const text = await callAI(prompt);
    const titleMatch = text.match(/(?:الاسم|Name)[:\s🏷️]+([^\n]+)/);
    const title = titleMatch?titleMatch[1].replace(/[🏷️*]/g,'').trim():q;
    currentRecipe={title,body:text,emoji:getEmoji(title),cat:activeTab!=='all'?activeTab:detectedCat};
    document.getElementById('result-area').innerHTML=`
      <div class="recipe-card">
        <div class="recipe-card-title">${currentRecipe.emoji} ${title}</div>
        <div class="recipe-body">${text}</div>
        <button class="save-btn" onclick="saveRecipe()">🔖 حفظ هذه الوصفة</button>
      </div>`;
  }catch(e){
    const msg=e.message==='no_key'?'أضف مفتاح API من الإعدادات':'حدث خطأ: '+e.message;
    document.getElementById('result-area').innerHTML=`<div class="loading-wrap" style="color:var(--accent)">${msg}</div>`;
  }
  btn.disabled=false;btn.textContent='ابحث';
}

function saveRecipe(){
  if(!currentRecipe) return;
  const recipes=load(STORAGE.recipes,[]);
  if(recipes.find(r=>r.title===currentRecipe.title)){showToast('محفوظة مسبقاً');return;}
  recipes.unshift({
    id:Date.now(),title:currentRecipe.title,body:currentRecipe.body,
    emoji:currentRecipe.emoji,cat:currentRecipe.cat,
    date:new Date().toLocaleDateString('ar-KW')
  });
  persist(STORAGE.recipes,recipes);
  document.getElementById('result-area').innerHTML='';
  document.getElementById('query-input').value='';
  currentRecipe=null;
  showToast('✅ تم حفظ الوصفة');
}

// ── SAVED CARDS ──
function renderCards(){
  const all=load(STORAGE.recipes,[]);
  const recipes=activeTab==='all'?all:all.filter(r=>r.cat===activeTab);
  const container=document.getElementById('cards-container');
  if(recipes.length===0){
    container.innerHTML=`<div class="empty-state"><div class="big">📭</div><div>لا توجد وصفات${activeTab!=='all'?' في هذه الفئة':''} بعد</div><button onclick="showScreen('search')" style="margin-top:12px;background:none;border:1.5px solid var(--border);border-radius:12px;padding:9px 18px;color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--fn)">← ابحث عن وصفة</button></div>`;
    return;
  }
  container.innerHTML=`
    <div class="section-hdr"><span class="section-title">الوصفات المحفوظة (${recipes.length})</span></div>
    <div class="cards-grid">
      ${recipes.map(r=>`
        <div class="wcard" onclick="openCard(${r.id})">
          <button class="wcard-del" onclick="deleteCard(${r.id},event)">×</button>
          ${r.cat&&r.cat!=='other'?`<div class="wcard-cat ${CAT_CLASS[r.cat]||''}">${CAT_LABELS[r.cat]||''}</div>`:''}
          <div class="wcard-emoji">${r.emoji}</div>
          <div class="wcard-title">${r.title}</div>
          <div class="wcard-date">${r.date}</div>
        </div>`).join('')}
    </div>`;
}

function openCard(id){
  const r=load(STORAGE.recipes,[]).find(r=>r.id===id);
  if(!r) return;
  document.getElementById('modal-title').textContent=r.emoji+' '+r.title;
  document.getElementById('modal-body').textContent=r.body;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function deleteCard(id,e){
  e.stopPropagation();
  if(!confirm('حذف هذه الوصفة؟')) return;
  persist(STORAGE.recipes,load(STORAGE.recipes,[]).filter(r=>r.id!==id));
  renderCards();showToast('تم الحذف');
}

// ── SETTINGS ──
function onApiTypeChange(){
  const type=document.getElementById('api-type').value;
  if(type==='gemini'){
    document.getElementById('key-label').textContent='مفتاح Google Gemini';
    document.getElementById('key-hint').innerHTML='احصل على مفتاح من <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a>';
    document.getElementById('api-key-input').placeholder='AIza...';
  } else {
    document.getElementById('key-label').textContent='مفتاح OpenRouter';
    document.getElementById('key-hint').innerHTML='احصل على مفتاح من <a href="https://openrouter.ai/settings/keys" target="_blank">openrouter.ai</a>';
    document.getElementById('api-key-input').placeholder='sk-or-v1-...';
  }
}
function loadSettingsUI(){
  document.getElementById('api-key-input').value=settings.apiKey;
  document.getElementById('api-type').value=settings.apiType;
  document.getElementById('lang-select').value=settings.lang;
  onApiTypeChange();updateApiBadge();
}
function updateApiBadge(){
  document.getElementById('api-status-badge').innerHTML=settings.apiKey
    ?'<span class="api-badge api-ok">✓ مفتاح محفوظ</span>'
    :'<span class="api-badge api-no">⚠️ لا يوجد مفتاح</span>';
}
function saveSettings(){
  settings.apiKey=document.getElementById('api-key-input').value.trim();
  settings.apiType=document.getElementById('api-type').value;
  settings.lang=document.getElementById('lang-select').value;
  persist(STORAGE.settings,settings);updateApiBadge();showToast('✅ تم الحفظ');
}
function clearAll(){
  if(!confirm('حذف جميع الوصفات المحفوظة؟')) return;
  localStorage.removeItem(STORAGE.recipes);showToast('تم الحذف');
}

// ── INIT ──
document.getElementById('query-input').addEventListener('keydown',e=>{if(e.key==='Enter') searchRecipe();});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal')) closeModal();});
updateApiBadge();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
